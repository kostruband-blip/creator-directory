name: Validate catalog

# Pull requests must contain a valid catalog and an up-to-date SEO layer.
# Direct edits in main are handled by rebuild_seo.yml (it regenerates the SEO layer automatically).
on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tools.json
        run: python validate_tools.py
      - name: Check that the SEO layer is up to date
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://creator-directory-chi.vercel.app' }}
        run: |
          python build_seo.py
          git add -N tools/ best/ && git diff --exit-code -- index.html sitemap.xml robots.txt tools/ best/ || (echo "Run 'python build_seo.py' and commit the result" && exit 1)
