name: Auto-expand directory

on:
  schedule:
    - cron: '0 10 * * 1'   # every Monday at 10:00 UTC
  workflow_dispatch:
    inputs:
      count:
        description: 'How many new tools to add in this run'
        required: false
        default: '3'
      target_category:
        description: 'Category to expand'
        required: false
        default: 'any'
        type: choice
        options:
          - any
          - shorts
          - captions
          - dubbing
          - thumbnails
          - analytics
          - telegram

permissions:
  contents: write

concurrency:
  group: auto-update-directory
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate current catalog
        run: python validate_tools.py

      - name: Find and add new tools
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL || 'https://creator-directory-chi.vercel.app' }}
          COUNT: ${{ github.event.inputs.count || '3' }}
          TARGET_CATEGORY: ${{ github.event.inputs.target_category || 'any' }}
        run: python auto_update_directory.py

      - name: Validate updated catalog
        run: python validate_tools.py

      - name: Remember commit before push (for IndexNow)
        id: pre
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools.json index.html sitemap.xml robots.txt tools/ best/
          git diff --staged --quiet || (git commit -m "chore: auto-expand directory [skip ci]" && git push)

      - name: Ping IndexNow (Bing, Yandex, DuckDuckGo) about changed pages
        if: success()
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://creator-directory-chi.vercel.app' }}
        run: |
          if [ "$(git rev-parse HEAD)" = "${{ steps.pre.outputs.sha }}" ]; then echo "No new commit, nothing to submit"; exit 0; fi
          echo "Waiting for the Vercel deploy..." && sleep 120
          python indexnow_submit.py --since ${{ steps.pre.outputs.sha }}
