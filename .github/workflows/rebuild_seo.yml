name: Rebuild site after manual edit

# Runs when someone edits tools.json (or assets) directly in main, e.g. via the GitHub web editor.
# Validates the catalog and regenerates the SEO layer (index.html prerender, sitemap.xml, asset versions).
on:
  push:
    branches: [main]
    paths: ['tools.json', 'assets/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update-directory
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tools.json (see the list of problems below if this step fails)
        run: python validate_tools.py
      - name: Rebuild SEO layer
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://creator-directory-chi.vercel.app' }}
        run: python build_seo.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html sitemap.xml robots.txt tools/
          git diff --staged --quiet || (git commit -m "chore: rebuild SEO layer [skip ci]" && git push)
